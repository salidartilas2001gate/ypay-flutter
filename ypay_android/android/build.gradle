buildscript {
    ext.kotlin_version = '1.8.20'
    repositories {
        google()
        mavenCentral()  // обязательно
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"  // ← Добавь эту строку!
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'  // теперь найдётся

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.yandex.pay.flutter_plugin'
    }

    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
        manifestPlaceholders = [YANDEX_CLIENT_ID: "331C8081294A63A400263BE5"]
    }

    dependencies {
        implementation('com.yandex.pay:pay:2.3.4')
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
    }
}